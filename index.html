<script>
/* =========================
   JARA AI — FREE TOOL PANEL
   ========================= */

const JARA_TOOLS = [
  {
    name: "AI Chat",
    prompt: "You are JaraAi, a helpful AI assistant. Answer clearly and directly."
  },
  {
    name: "Image Prompt",
    prompt: "Create a detailed cinematic AI image-generation prompt. Include subject, environment, lighting, camera, composition and 16:9."
  },
  {
    name: "Video Prompt",
    prompt: "Create a detailed cinematic AI video prompt with camera movement, subject movement, environment, lighting and duration."
  },
  {
    name: "Research",
    prompt: "Act as a research assistant. Organize the topic into facts, dates, locations, people, evidence, investigation and unanswered questions. Never invent missing facts."
  },
  {
    name: "Documentary",
    prompt: "Create a serious, natural, cinematic documentary structure with a strong hook, chronological storytelling and audience retention."
  }
];

/* ---------- 4 HOUR FREE SESSION ---------- */

const JARA_SESSION_TIME = 4 * 60 * 60 * 1000;
const JARA_START_KEY = "jaraAiSessionStart";

function jaraStartSession() {
  let start = localStorage.getItem(JARA_START_KEY);

  if (!start) {
    start = Date.now().toString();
    localStorage.setItem(JARA_START_KEY, start);
  }

  return Number(start);
}

function jaraRemainingTime() {
  const start = jaraStartSession();
  return Math.max(0, JARA_SESSION_TIME - (Date.now() - start));
}

function jaraFormatTime(ms) {
  const total = Math.floor(ms / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;

  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function jaraTimer() {
  const remaining = jaraRemainingTime();

  const timer = document.getElementById("jaraTimer");

  if (timer) {
    timer.textContent = "Free: " + jaraFormatTime(remaining);
  }

  if (remaining <= 0) {
    const send = document.querySelector(".send");
    if (send) send.disabled = true;

    if (timer) timer.textContent = "Free session ended";
  }
}

setInterval(jaraTimer, 1000);
jaraTimer();


/* ---------- TOOL BUTTONS ---------- */

function jaraCreateTools() {

  if (document.getElementById("jaraTools")) return;

  const box = document.createElement("div");
  box.id = "jaraTools";

  box.style.cssText = `
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin:12px 0 4px;
  `;

  JARA_TOOLS.forEach(tool => {

    const button = document.createElement("button");

    button.textContent = tool.name;

    button.style.cssText = `
      padding:9px 14px;
      border-radius:999px;
      background:rgba(124,92,255,.12);
      border:1px solid rgba(124,92,255,.35);
      color:white;
      cursor:pointer;
      font-size:13px;
    `;

    button.onclick = () => {

      const textarea = document.querySelector("textarea");

      if (!textarea) return;

      if (tool.name === "AI Chat") {
        textarea.value = "";
        textarea.placeholder = "Ask JaraAi anything...";
      } else {
        textarea.value =
          `[${tool.name}]\n\n` +
          `Topic: \n\n` +
          `Create the result using these instructions:\n` +
          tool.prompt;
      }

      textarea.focus();
    };

    box.appendChild(button);
  });

  const chat = document.querySelector(".chat");

  if (chat) {
    chat.parentNode.insertBefore(box, chat);
  }
}


/* ---------- TIMER DISPLAY ---------- */

function jaraCreateTimer() {

  if (document.getElementById("jaraTimer")) return;

  const header = document.querySelector("header");

  if (!header) return;

  const timer = document.createElement("div");

  timer.id = "jaraTimer";

  timer.style.cssText = `
    font-size:12px;
    color:#8effbd;
    margin-top:4px;
  `;

  header.appendChild(timer);

  jaraTimer();
}


/* ---------- START ---------- */

document.addEventListener("DOMContentLoaded", () => {
  jaraCreateTools();
  jaraCreateTimer();
});

</script>
