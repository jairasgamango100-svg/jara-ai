<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070a12">
  <meta name="description" content="JARA AI - Personal AI Assistant">
  <title>JARA AI - AI Assistant</title>

  <style>
    :root {
      --bg: #070a12;
      --panel: rgba(15, 20, 35, 0.88);
      --panel2: rgba(25, 32, 55, 0.75);
      --text: #f5f7ff;
      --muted: #9aa5bc;
      --line: rgba(255,255,255,0.1);
      --purple: #7c5cff;
      --blue: #00d9ff;
      --user: #202a44;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(124,92,255,.2), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(0,217,255,.14), transparent 28%),
        linear-gradient(145deg, #05070d, #0a0f1c, #060812);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .15;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    button,
    textarea {
      font: inherit;
    }

    .app {
      width: min(1050px, 100%);
      min-height: 100vh;
      margin: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      box-shadow: 0 0 30px rgba(124,92,255,.4);
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
    }

    .brand small {
      color: var(--muted);
    }

    .status {
      color: #aeb8ca;
      font-size: 13px;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 6px;
      border-radius: 50%;
      background: #36e58d;
      box-shadow: 0 0 12px #36e58d;
    }

    .hero {
      text-align: center;
      padding: 45px 10px 35px;
    }

    .orb {
      width: 110px;
      height: 110px;
      margin: auto;
      margin-bottom: 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 42px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      box-shadow:
        0 0 45px rgba(124,92,255,.45),
        0 0 90px rgba(0,217,255,.15);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .hero h2 {
      margin: 0;
      font-size: clamp(36px, 8vw, 70px);
      letter-spacing: -3px;
    }

    .gradient {
      background: linear-gradient(90deg, #ffffff, #a99aff, #55e8ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      max-width: 650px;
      margin: 18px auto;
      color: var(--muted);
      line-height: 1.7;
    }

    .chat {
      max-width: 900px;
      width: 100%;
      margin: auto;
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      background: var(--panel);
      box-shadow: 0 25px 80px rgba(0,0,0,.45);
      backdrop-filter: blur(20px);
    }

    .chat-top {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
    }

    #messages {
      min-height: 330px;
      max-height: 52vh;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 80%;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      line-height: 1.6;
      white-space: pre-wrap;
      animation: appear .25s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.ai {
      align-self: flex-start;
      background: var(--panel2);
      border-top-left-radius: 6px;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user);
      border-top-right-radius: 6px;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid var(--line);
      background: rgba(0,0,0,.25);
    }

    textarea {
      flex: 1;
      min-height: 52px;
      max-height: 150px;
      resize: none;
      outline: none;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 15px;
      color: white;
      background: rgba(255,255,255,.05);
    }

    textarea:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(124,92,255,.12);
    }

    .actions {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .icon-btn,
    .send {
      height: 52px;
      border: 0;
      border-radius: 15px;
      cursor: pointer;
      color: white;
      transition: .2s;
    }

    .icon-btn {
      width: 52px;
      background: rgba(255,255,255,.08);
    }

    .send {
      padding: 0 18px;
      font-weight: bold;
      background: linear-gradient(135deg, var(--purple), #5e8dff);
    }

    .icon-btn:hover,
    .send:hover {
      transform: translateY(-2px);
    }

    .quick {
      max-width: 900px;
      margin: 16px auto 45px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .quick button {
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #cbd3e5;
      background: rgba(255,255,255,.04);
      cursor: pointer;
    }

    .quick button:hover {
      border-color: var(--purple);
      color: white;
    }

    .typing span {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin: 0 2px;
      border-radius: 50%;
      background: #aab4c8;
      animation: blink 1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes blink {
      0%,80%,100% {
        opacity: .25;
      }
      40% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    footer {
      margin-top: auto;
      padding: 20px;
      text-align: center;
      color: #69748a;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .app {
        padding: 12px;
      }

      .status {
        display: none;
      }

      .hero {
        padding-top: 30px;
      }

      .message {
        max-width: 88%;
      }

      .composer {
        padding: 10px;
      }

      .send {
        padding: 0 14px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header>
      <div class="brand">
        <div class="logo">J</div>
        <div>
          <h1>JARA AI</h1>
          <small>Personal AI Assistant</small>
        </div>
      </div>

      <div class="status">
        <span class="dot"></span>
        System Ready
      </div>
    </header>

    <section class="hero">

      <div class="orb">J</div>

      <h2>
        Meet <span class="gradient">JARA AI</span>
      </h2>

      <p>
        Your futuristic AI assistant. Ask questions, brainstorm ideas,
        learn something new, or simply start a conversation.
      </p>

    </section>

    <section class="chat">

      <div class="chat-top">
        <span>JARA AI • Demo Mode</span>
        <span id="clock"></span>
      </div>

      <div id="messages">

        <div class="message ai">
          Hello! 👋 I'm JARA AI.

          How can I help you today?
        </div>

      </div>

      <div class="composer">

        <textarea
          id="input"
          rows="1"
          placeholder="Message JARA AI..."
          aria-label="Message JARA AI">
        </textarea>

        <div class="actions">

          <button
            class="icon-btn"
            id="voiceBtn"
            title="Voice input">
            🎤
          </button>

          <button
            class="send"
            id="sendBtn">
            Send
          </button>

        </div>

      </div>

    </section>

    <div class="quick">

      <button data-prompt="Give me 5 creative website ideas.">
        💡 Ideas
      </button>

      <button data-prompt="Write a short motivational message for me.">
        ✨ Motivation
      </button>

      <button data-prompt="Explain artificial intelligence in simple words.">
        🤖 Explain AI
      </button>

      <button data-prompt="Write a short professional bio for a developer.">
        📝 Write a Bio
      </button>

    </div>

    <footer>
      © <span id="year"></span> JARA AI • Built with HTML, CSS & JavaScript
    </footer>

  </main>

  <script>

    const messages = document.getElementById("messages");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const voiceBtn = document.getElementById("voiceBtn");

    function addMessage(text, type) {

      const div = document.createElement("div");

      div.className = "message " + type;

      div.textContent = text;

      messages.appendChild(div);

      messages.scrollTop = messages.scrollHeight;

      return div;
    }

    function showTyping() {

      const div = document.createElement("div");

      div.className = "message ai typing";

      div.innerHTML =
        "<span></span><span></span><span></span>";

      messages.appendChild(div);

      messages.scrollTop = messages.scrollHeight;

      return div;
    }

    function getReply(text) {

      const lower = text.toLowerCase();

      if (
        lower.includes("hello") ||
        lower.includes("hi") ||
        lower.includes("namaste")
      ) {
        return "Hello! 👋 I'm JARA AI. Nice to meet you!";
      }

      if (
        lower.includes("who are you") ||
        lower.includes("what are you")
      ) {
        return "I'm JARA AI — a futuristic AI assistant interface built with HTML, CSS and JavaScript.";
      }

      if (lower.includes("website")) {
        return "I can help you create website ideas, layouts, content and front-end code. 🚀";
      }

      if (lower.includes("ai")) {
        return "AI means Artificial Intelligence. It allows computers to perform tasks that normally require human intelligence, such as understanding language, recognizing patterns and generating content.";
      }

      if (lower.includes("motivat")) {
        return "Keep building! 💪 Small improvements every day can turn your idea into something amazing.";
      }

      if (lower.includes("idea")) {
        return "Here are 5 ideas: 1. AI Portfolio 2. Study Assistant 3. AI Chatbot 4. AI Image Prompt Studio 5. Productivity Dashboard.";
      }

      if (lower.includes("bio")) {
        return "I'm a passionate developer who loves technology, creativity and building useful digital experiences.";
      }

      return "Thanks for your message! 💜 I'm currently running in Demo Mode. A real AI model can be connected later through a secure backend/API.";
    }

    function sendMessage(customText) {

      const text = (customText || input.value).trim();

      if (!text) return;

      addMessage(text, "user");

      input.value = "";

      input.style.height = "52px";

      const typing = showTyping();

      setTimeout(function() {

        typing.remove();

        addMessage(getReply(text), "ai");

      }, 700);
    }

    sendBtn.addEventListener("click", function() {
      sendMessage();
    });

    input.addEventListener("keydown", function(event) {

      if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();

      }

    });

    input.addEventListener("input", function() {

      input.style.height = "52px";

      input.style.height =
        Math.min(input.scrollHeight, 150) + "px";

    });

    document.querySelectorAll(".quick button").forEach(function(button) {

      button.addEventListener("click", function() {

        sendMessage(button.dataset.prompt);

      });

    });

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (SpeechRecognition) {

      const recognition = new SpeechRecognition();

      recognition.lang = "en-IN";

      recognition.interimResults = false;

      voiceBtn.addEventListener("click", function() {

        recognition.start();

        voiceBtn.textContent = "🔴";

      });

      recognition.onresult = function(event) {

        input.value =
          event.results[0][0].transcript;

        input.dispatchEvent(new Event("input"));

      };

      recognition.onend = function() {

        voiceBtn.textContent = "🎤";

      };

      recognition.onerror = function() {

        voiceBtn.textContent = "🎤";

      };

    } else {

      voiceBtn.addEventListener("click", function() {

        addMessage(
          "Voice input is not supported by this browser.",
          "ai"
        );

      });

    }

    function updateClock() {

      document.getElementById("clock").textContent =
        new Date().toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });

    }

    document.getElementById("year").textContent =
      new Date().getFullYear();

    updateClock();

    setInterval(updateClock, 30000);

  </script>

</body>
  </html>
